<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grok 6.91 | Official Entry</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* إجبار الجسم على ملء الشاشة ومنع الارتداد في iOS */
        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            position: fixed;
        }

        /* حاوية مرنة تستجيب لارتفاع متصفح تلغرام */
        .mobile-container {
            height: var(--tg-viewport-height, 100vh);
            width: 100%;
            display: flex;
            flex-col: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.25) contrast(1.2);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .glow-button {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(110, 235, 54, 0.2); }
            50% { box-shadow: 0 0 25px rgba(110, 235, 54, 0.4); }
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(1.1) !important;
            filter: blur(20px) !important;
            transition: all 0.8s ease-in-out !important;
        }
    </style>
</head>
<body class="bg-black text-white antialiased">

    <!-- Video Background -->
    <div class="video-wrapper">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Background UI Simulation (الخلفية المحذوفة تم استعادتها) -->
    <div class="fixed inset-0 flex items-center justify-center z-0 opacity-10 select-none pointer-events-none p-6">
        <div class="w-full max-w-lg space-y-6">
            <div class="glass-panel p-6 rounded-3xl space-y-4 border-none">
                <div class="h-4 w-1/3 bg-emerald-500/20 rounded"></div>
                <div class="h-12 w-full bg-black/40 border border-white/5 rounded-xl"></div>
                <div class="h-12 w-full bg-black/40 border border-white/5 rounded-xl"></div>
                <div class="h-14 w-full bg-emerald-600/30 rounded-xl"></div>
            </div>
        </div>
    </div>

    <div class="mobile-container relative z-10 flex flex-col items-center justify-center p-6">
        
        <!-- Main Modal Panel -->
        <div id="modalOverlay" class="glass-panel max-w-sm w-full rounded-[2.5rem] p-8 text-white flex flex-col relative overflow-hidden">
            
            <!-- Header Section -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-[#6EEB36] to-emerald-600 p-0.5 mb-4 shadow-xl shadow-emerald-500/20">
                    <div class="w-full h-full bg-black rounded-[calc(1rem+4px)] flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#6EEB36]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                </div>
                <h1 class="text-3xl font-black tracking-tighter uppercase">GROK <span class="text-[#6EEB36]">6.91</span></h1>
                <p class="text-[#6EEB36]/60 text-[9px] font-bold uppercase tracking-[0.3em] mt-1">Full-Screen Secure Link</p>
            </div>

            <!-- Rules Content -->
            <div class="space-y-4 mb-8">
                <div class="p-4 rounded-xl bg-white/5 border border-white/5">
                    <h3 class="font-bold text-white text-md">System Policy</h3>
                    <p class="text-gray-400 text-xs leading-relaxed mt-1">1 transaction per IP every 24 hours. Limit: <span class="text-[#6EEB36] font-bold">200k USDT</span>.</p>
                </div>
                
                <div class="text-[11px] text-gray-500 leading-relaxed px-1">
                    By clicking continue, you agree to our <u>terms of service</u> and privacy protocols for Telegram Mini Apps.
                </div>
            </div>

            <!-- The Action Button (Using your color #6EEB36) -->
            <button id="registerbutton" onclick="handleConfirm()"
                    class="glow-button w-full bg-[#6EEB36] text-black font-black py-5 rounded-2xl hover:bg-[#5ACC2F] transition duration-150 shadow-lg shadow-[#6EEB36]/20 uppercase tracking-widest">
                Confirm & Proceed
            </button>
        </div>
    </div>

    <script type="text/javascript">
        // 🟢 دمج كود تلغرام المتقدم الخاص بك
        const tg = window.Telegram.WebApp;

        if (tg) {
            tg.ready();
            tg.expand(); // يطلب التوسيع فوراً
            
            // طلب ملء الشاشة الرسمي إذا كان متاحاً
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }

            // ضبط الألوان لتناسب الواجهة وتخفي الأشرطة
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        function handleConfirm() {
            const btn = document.getElementById('registerbutton');
            const modal = document.getElementById('modalOverlay');
            
            // Haptic Feedback (اختياري لتجربة تلغرام)
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            btn.innerHTML = 'INITIALIZING...';
            btn.disabled = true;

            // تطبيق تأثير الاختفاء
            setTimeout(() => {
                modal.classList.add('fade-out');
                
                // التوجيه
                setTimeout(() => {
                    window.location.href = 'main.html';
                }, 800);
            }, 500);
        }

        // تحديث الارتفاع ديناميكياً بناءً على تقرير تلغرام
        tg.onEvent('viewportChanged', (data) => {
            document.documentElement.style.setProperty('--tg-viewport-height', `${data.height}px`);
        });

        // التأكد من تشغيل الفيديو عند التحميل
        window.addEventListener('load', () => {
            const video = document.getElementById('bg-video');
            video.play().catch(() => {});
        });
    </script>
</body>
</html>
