<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grok Enterprise Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        
        .app-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-animate { animation: slideDown 0.2s ease-out; }
        
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 35px 35px 0 0;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .animate-support {
            animation: pulse-border 2s infinite;
        }

        .animate-check-now {
            animation: pulse-red 2s infinite;
        }
        
        .timer-glow {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .modal-blur {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="fixed inset-0 flex items-center justify-center">

    <div class="app-overlay"></div>

    <!-- Loading Screen -->
    <div id="loadingOverlay" class="loading-overlay">
        <svg class="text-white animate-pulse mb-4" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <div class="text-white text-[10px] font-bold tracking-[0.3em] uppercase mb-6 text-center px-4">Synchronizing Node...</div>
        <div class="w-40 h-[2px] bg-white/10 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-white transition-all duration-300 w-0"></div>
        </div>
    </div>

    <!-- New Prices Modal -->
    <div id="pricesModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 modal-blur">
        <div class="bg-zinc-900 border border-white/10 w-full max-w-[300px] rounded-[30px] p-5 shadow-2xl transform transition-all scale-100">
            <div class="text-center mb-5">
                <div class="w-10 h-10 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-2">
                    <svg class="text-red-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <h3 class="text-white text-base font-black uppercase tracking-widest">New Price List</h3>
                <p class="text-white/40 text-[9px] font-bold uppercase mt-1">Effective after countdown ends</p>
            </div>
            
            <div class="space-y-2.5 mb-5">
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                    <span class="text-white/60 text-[10px] font-bold uppercase">300 USDT</span>
                    <span class="text-red-500 font-black text-base">69$</span>
                </div>
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                    <span class="text-white/60 text-[10px] font-bold uppercase">1500 USDT</span>
                    <span class="text-red-500 font-black text-base">345$</span>
                </div>
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                    <span class="text-white/60 text-[10px] font-bold uppercase">3000 USDT</span>
                    <span class="text-red-500 font-black text-base">690$</span>
                </div>
            </div>

            <button id="closeModal" class="w-full py-3.5 bg-white text-black rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">
                Understood
            </button>
        </div>
    </div>

    <!-- Floating Support Button -->
    <a href="https://t.me/ZhangHaoyu1921" target="_blank" class="fixed bottom-4 right-4 z-[60] group">
        <div class="flex items-center gap-2 bg-black border border-white/20 p-1.5 pr-3 rounded-full shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95 animate-support">
            <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center group-hover:bg-blue-500 transition-colors">
                <svg class="text-white" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.5 8.5 0 0 1 7.6 4.5"></path>
                    <path d="M21 12l-5-1 5-1"></path>
                    <path d="M18 12h3"></path>
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="text-[7px] font-black text-white/40 uppercase tracking-tighter">Enterprise</span>
                <span class="text-[9px] font-black text-white uppercase tracking-wider">Support</span>
            </div>
        </div>
    </a>

    <!-- Main Content -->
    <div class="w-full max-w-[420px] h-full flex flex-col relative z-10 px-6 pt-6">
        
        <header class="flex flex-col items-center mb-4">
            <div class="w-14 h-14 rounded-[18px] p-[2px] bg-gradient-to-br from-zinc-600 to-black border border-white/20 mb-2 shadow-xl overflow-hidden">
                <img id="userPhoto" src="https://ui-avatars.com/api/?name=Node&background=000&color=fff" class="w-full h-full rounded-[16px] object-cover" alt="Profile">
            </div>
            <h2 id="userName" class="text-white text-[10px] font-black tracking-[0.1em] uppercase">SYNCING...</h2>
            <div class="mt-1 px-2.5 py-0.5 bg-black/40 border border-white/10 backdrop-blur-md rounded-full">
                <span id="userId" class="text-white/70 font-mono text-[8px] tracking-widest uppercase">UID: 000000000</span>
            </div>
        </header>

        <!-- Countdown Banner - Compact -->
        <div class="mb-4 w-full bg-white/5 border border-white/10 rounded-2xl p-3 backdrop-blur-md">
            <div class="flex flex-col items-center gap-1.5">
                <div id="countdown" class="flex gap-3">
                    <div class="flex flex-col items-center">
                        <span id="days" class="text-white text-lg font-black leading-none timer-glow">00</span>
                        <span class="text-[6px] text-white/40 uppercase font-bold mt-0.5 tracking-widest">Days</span>
                    </div>
                    <span class="text-white/20 font-black text-lg">:</span>
                    <div class="flex flex-col items-center">
                        <span id="hours" class="text-white text-lg font-black leading-none timer-glow">00</span>
                        <span class="text-[6px] text-white/40 uppercase font-bold mt-0.5 tracking-widest">Hours</span>
                    </div>
                    <span class="text-white/20 font-black text-lg">:</span>
                    <div class="flex flex-col items-center">
                        <span id="minutes" class="text-white text-lg font-black leading-none timer-glow">00</span>
                        <span class="text-[6px] text-white/40 uppercase font-bold mt-0.5 tracking-widest">Min</span>
                    </div>
                    <span class="text-white/20 font-black text-lg">:</span>
                    <div class="flex flex-col items-center">
                        <span id="seconds" class="text-white text-lg font-black leading-none timer-glow">00</span>
                        <span class="text-[6px] text-white/40 uppercase font-bold mt-0.5 tracking-widest">Sec</span>
                    </div>
                </div>
                <div class="w-full h-[1px] bg-white/5 my-0.5"></div>
                <p class="text-[8px] text-center font-bold text-white/70 tracking-tight leading-tight px-2">
                    Prices will increase by <span class="text-red-500 font-black">120%</span>.
                </p>
                <!-- Compact Check Now Button -->
                <button id="openModalBtn" class="mt-1 px-4 py-1.5 bg-red-600 rounded-full text-[8px] font-black text-white uppercase tracking-[0.2em] animate-check-now active:scale-90 transition-all">
                    Check Now
                </button>
            </div>
        </div>

        <div class="content-container shadow-2xl flex-1 p-4 pb-4 space-y-3.5 border-x border-t border-black/5 flex flex-col justify-between mb-0 overflow-hidden">
            
            <div class="space-y-3">
                <!-- Platform Dropdown -->
                <div class="relative">
                    <label class="text-[8px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1 block">Enterprise Source</label>
                    <button id="dropdownBtn" class="w-full bg-zinc-50 border border-zinc-100 rounded-xl p-3 flex items-center justify-between transition-all active:bg-zinc-100">
                        <div class="flex items-center gap-2">
                            <span id="selectedPlatformText" class="text-[10px] font-bold text-zinc-300 uppercase">Select Access Point</span>
                        </div>
                        <svg class="text-zinc-400 transition-transform" id="dropdownArrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="dropdownMenu" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-xl shadow-2xl z-50 max-h-[160px] overflow-y-auto no-scrollbar grid grid-cols-1 gap-1 p-2 dropdown-animate">
                        <!-- Platforms -->
                    </div>
                </div>

                <!-- Address Input -->
                <div>
                    <label class="text-[8px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1 block">Destination Hash</label>
                    <input id="addressInput" type="text" placeholder="Target Address..." class="w-full bg-zinc-50 border border-zinc-100 rounded-xl p-3 text-[10px] font-bold text-black outline-none focus:bg-white transition-all placeholder:text-zinc-200">
                </div>

                <!-- Protocols -->
                <div>
                    <label class="text-[8px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1 block">Detected Protocol</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div data-net="TRC20" class="net-btn py-2 rounded-xl text-[8px] text-center font-black border flex flex-col items-center justify-center gap-1 bg-zinc-50 border-zinc-100 text-zinc-300 opacity-60 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/tron-trx-logo.png" class="w-5 h-5"> TRC20
                        </div>
                        <div data-net="BEP20" class="net-btn py-2 rounded-xl text-[8px] text-center font-black border flex flex-col items-center justify-center gap-1 bg-zinc-50 border-zinc-100 text-zinc-300 opacity-60 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" class="w-5 h-5"> BEP20
                        </div>
                        <div data-net="TON" class="net-btn py-2 rounded-xl text-[8px] text-center font-black border flex flex-col items-center justify-center gap-1 bg-zinc-50 border-zinc-100 text-zinc-300 opacity-60 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" class="w-5 h-5"> TON
                        </div>
                    </div>
                </div>

                <!-- Amounts -->
                <div class="flex-1 overflow-y-auto no-scrollbar">
                    <label class="text-[8px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1 block">Resource Volume</label>
                    <div class="flex flex-col gap-1.5">
                        <button data-amt="300" data-cost="12" class="amt-btn px-3.5 py-2.5 rounded-xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all">
                            <div class="text-left"><div class="text-[10px] font-black text-inherit">300 USDT</div><div class="text-[6px] font-bold opacity-40 uppercase">Global Sync</div></div>
                            <div class="text-[9px] font-black px-2 py-0.5 rounded-lg bg-zinc-100 text-zinc-500">12$</div>
                        </button>
                        <button data-amt="1500" data-cost="60" class="amt-btn px-3.5 py-2.5 rounded-xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all">
                            <div class="text-left"><div class="text-[10px] font-black text-inherit">1500 USDT</div><div class="text-[6px] font-bold opacity-40 uppercase">Global Sync</div></div>
                            <div class="text-[9px] font-black px-2 py-0.5 rounded-lg bg-zinc-100 text-zinc-500">60$</div>
                        </button>
                        <button data-amt="3000" data-cost="100" class="amt-btn px-3.5 py-2.5 rounded-xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all">
                            <div class="text-left"><div class="text-[10px] font-black text-inherit">3000 USDT</div><div class="text-[6px] font-bold opacity-40 uppercase">Global Sync</div></div>
                            <div class="text-[9px] font-black px-2 py-0.5 rounded-lg bg-zinc-100 text-zinc-500">100$</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="pt-1">
                <button id="authorizeBtn" disabled class="w-full py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-2 bg-zinc-100 text-zinc-300 cursor-not-allowed">
                    Authorize <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </button>
                <div class="text-center mt-2 opacity-20 flex flex-col items-center gap-0.5">
                    <div class="flex items-center gap-1.5 text-black font-black text-[8px] uppercase tracking-[0.3em]">
                        Grok Enterprise
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const modal = document.getElementById('pricesModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModal');

        openBtn.onclick = () => { modal.style.display = 'flex'; };
        closeBtn.onclick = () => { modal.style.display = 'none'; };
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        function updateCountdown() {
            const targetDate = new Date("January 28, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const gap = targetDate - now;

            if (gap <= 0) {
                document.getElementById('countdown').innerHTML = "<span class='text-red-500 text-[8px] font-black uppercase tracking-widest'>Offer Expired</span>";
                return;
            }

            const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;
            const d = Math.floor(gap / day), h = Math.floor((gap % day) / hour), m = Math.floor((gap % hour) / minute), s = Math.floor((gap % minute) / second);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        let selectedPlatform = null, selectedNetwork = '', selectedAmount = null, addressValue = '';

        const platforms = [
            { n: 'Binance', i: 'binance.png' }, { n: 'Bybit', i: 'bybit.png' },
            { n: 'Mexc', i: 'mexc.png' }, { n: '1xbet', i: '1xbet.png' },
            { n: 'Linebet', i: 'linebet.png' }, { n: 'Melbet', i: 'malbet.png' },
            { n: 'Megapari', i: 'megapari.png' }, { n: 'Trust Wallet', i: 'trustwallet.png' },
            { n: 'MetaMask', i: 'metamask.png' }, { n: 'Pocket Option', i: 'pocket.png' },
            { n: 'TronLink', i: 'tronlink.png' }, { n: 'XM', i: 'xm.png' },
            { n: 'Tickmill', i: 'tickmall.png }, { n: 'Exness', i: 'exness.png' },
            { n: 'Quotex', i: 'quotex.p'ng' }, { n: 'eToro', i: 'etoro.png' }
        ];

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = (user.first_name + ' ' + (user.last_name || '')).toUpperCase();
            document.getElementById('userId').textContent = 'UID: ' + user.id;
            if (user.photo_url) document.getElementById('userPhoto').src = user.photo_url;
        }

        const menu = document.getElementById('dropdownMenu');
        platforms.forEach(p => {
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2 p-2 hover:bg-zinc-50 rounded-lg cursor-pointer transition-colors border border-transparent active:bg-zinc-100';
            div.innerHTML = `<img src="${p.i}" class="w-5 h-5 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"><span class="text-[9px] font-bold text-zinc-700">${p.n}</span>`;
            div.onclick = () => {
                selectedPlatform = p;
                document.getElementById('selectedPlatformText').innerHTML = `<img src="${p.i}" class="w-3.5 h-3.5 inline-block mr-2" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"><span class="text-black">${p.n}</span>`;
                menu.classList.add('hidden');
                document.getElementById('dropdownArrow').classList.remove('rotate-180');
                validate();
            };
            menu.appendChild(div);
        });

        document.getElementById('dropdownBtn').onclick = () => {
            menu.classList.toggle('hidden');
            document.getElementById('dropdownArrow').classList.toggle('rotate-180');
        };

        document.getElementById('addressInput').oninput = (e) => {
            addressValue = e.target.value;
            if (addressValue.startsWith('T') && addressValue.length >= 30) selectedNetwork = 'TRC20';
            else if (addressValue.startsWith('0x') && addressValue.length >= 40) selectedNetwork = 'BEP20';
            else if ((addressValue.startsWith('U') || addressValue.startsWith('E')) && addressValue.length >= 40) selectedNetwork = 'TON';
            else selectedNetwork = '';
            
            document.querySelectorAll('.net-btn').forEach(btn => {
                const isMatch = btn.dataset.net === selectedNetwork;
                btn.className = `net-btn py-2 rounded-xl text-[8px] text-center font-black transition-all border flex flex-col items-center justify-center gap-1 ${isMatch ? 'bg-black border-black text-white shadow-md' : 'bg-zinc-50 border-zinc-100 text-zinc-300 opacity-60'}`;
            });
            validate();
        };

        document.querySelectorAll('.net-btn').forEach(btn => {
            btn.onclick = () => {
                selectedNetwork = btn.dataset.net;
                document.querySelectorAll('.net-btn').forEach(b => {
                    const active = b === btn;
                    b.className = `net-btn py-2 rounded-xl text-[8px] text-center font-black transition-all border flex flex-col items-center justify-center gap-1 ${active ? 'bg-black border-black text-white shadow-md' : 'bg-zinc-50 border-zinc-100 text-zinc-300 opacity-60'}`;
                });
                validate();
            };
        });

        document.querySelectorAll('.amt-btn').forEach(btn => {
            btn.onclick = () => {
                selectedAmount = parseInt(btn.dataset.amt);
                document.querySelectorAll('.amt-btn').forEach(b => {
                    const active = b === btn;
                    b.className = `amt-btn px-3.5 py-2.5 rounded-xl flex items-center justify-between transition-all border ${active ? 'bg-black border-black text-white' : 'bg-zinc-50 border-zinc-100 text-zinc-400'}`;
                    b.querySelector('div:last-child').className = `text-[9px] font-black px-2 py-0.5 rounded-lg ${active ? 'bg-white text-black' : 'bg-zinc-100 text-zinc-500'}`;
                });
                validate();
            };
        });

        function validate() {
            const btn = document.getElementById('authorizeBtn');
            const isValid = selectedPlatform && addressValue && selectedNetwork && selectedAmount;
            if (isValid) {
                btn.disabled = false;
                btn.className = 'w-full py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-2 bg-black text-white shadow-xl active:scale-95';
            } else {
                btn.disabled = true;
                btn.className = 'w-full py-3.5 rounded-xl font-black text-[10px] uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-2 bg-zinc-100 text-zinc-300 cursor-not-allowed';
            }
        }

        document.getElementById('authorizeBtn').onclick = () => {
            const overlay = document.getElementById('loadingOverlay');
            const bar = document.getElementById('progressBar');
            overlay.style.display = 'flex';
            let p = 0;
            const interval = setInterval(() => {
                p += 2; bar.style.width = p + '%';
                if (p >= 100) {
                    clearInterval(interval);
                    if (selectedAmount === 300) window.location.href = "12.html";
                    else if (selectedAmount === 1500) window.location.href = "60.html";
                    else if (selectedAmount === 3000) window.location.href = "100.html";
                }
            }, 30);
        };
    </script>
</body>
</html>
