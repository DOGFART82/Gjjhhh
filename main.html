<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grok Enterprise Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* تم تعديل الخلفية لتكون الجزء العلوي أسود تماماً والأسفل أبيض */
            background: linear-gradient(to bottom, #000000 50%, #ffffff 50%);
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-animate { animation: slideDown 0.2s ease-out; }
        
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* حاوية المحتوى الرئيسية */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="fixed inset-0 flex items-center justify-center">

    <!-- Loading Screen -->
    <div id="loadingOverlay" class="loading-overlay">
        <svg class="text-white animate-pulse mb-4" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <div class="text-white text-[11px] font-bold tracking-[0.3em] uppercase mb-6 text-center px-4">Synchronizing Node...</div>
        <div class="w-48 h-[2px] bg-white/10 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-white transition-all duration-300 w-0"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="app-container w-full max-w-[420px] relative z-10 px-4">
        
        <!-- Header: يظهر دائماً فوق الخلفية السوداء -->
        <header class="flex flex-col items-center pt-8 pb-6">
            <div class="w-20 h-20 rounded-[28px] p-[2px] bg-gradient-to-br from-zinc-700 to-black border border-white/20 mb-3 shadow-2xl overflow-hidden ring-4 ring-black">
                <img id="userPhoto" src="https://ui-avatars.com/api/?name=Node&background=000&color=fff" class="w-full h-full rounded-[26px] object-cover" alt="Profile">
            </div>
            <h2 id="userName" class="text-white text-[13px] font-black tracking-[0.15em] uppercase">SYNCING...</h2>
            <div class="mt-1.5 px-3 py-1 bg-white/5 border border-white/10 rounded-full">
                <span id="userId" class="text-zinc-500 font-mono text-[10px] tracking-widest uppercase">UID: 000000000</span>
            </div>
        </header>

        <!-- White Card Section -->
        <div class="bg-white rounded-t-[45px] shadow-[0_-20px_60px_-15px_rgba(0,0,0,0.5)] flex-1 p-6 pb-8 space-y-4 border-x border-t border-black/5 flex flex-col overflow-y-auto no-scrollbar">
            
            <div class="flex-1 space-y-5">
                <!-- Platform Dropdown -->
                <div class="relative">
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1.5 block">Enterprise Source</label>
                    <button id="dropdownBtn" class="w-full bg-zinc-50 border border-zinc-100 rounded-2xl p-4 flex items-center justify-between transition-all active:scale-[0.98] active:bg-zinc-100">
                        <div class="flex items-center gap-3">
                            <span id="selectedPlatformText" class="text-xs font-bold text-zinc-400 uppercase">Select Access Point</span>
                        </div>
                        <svg class="text-zinc-400 transition-transform duration-300" id="dropdownArrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="dropdownMenu" class="hidden absolute top-full left-0 right-0 mt-2 bg-white border border-zinc-200 rounded-2xl shadow-2xl z-50 max-h-[220px] overflow-y-auto no-scrollbar grid grid-cols-2 gap-1.5 p-2 dropdown-animate">
                        <!-- Platforms injected by JS -->
                    </div>
                </div>

                <!-- Address Input -->
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1.5 block">Destination Hash</label>
                    <input id="addressInput" type="text" placeholder="Target Wallet Address..." class="w-full bg-zinc-50 border border-zinc-100 rounded-2xl p-4 text-xs font-bold text-black outline-none focus:ring-2 focus:ring-zinc-200 focus:bg-white transition-all placeholder:text-zinc-300">
                </div>

                <!-- Protocols -->
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1.5 block">Network Protocol</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div data-net="TRC20" class="net-btn py-3 rounded-2xl text-[10px] text-center font-black border flex flex-col items-center justify-center gap-1.5 bg-zinc-50 border-zinc-100 text-zinc-300 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/tron-trx-logo.png" class="w-4 h-4"> TRC20
                        </div>
                        <div data-net="BEP20" class="net-btn py-3 rounded-2xl text-[10px] text-center font-black border flex flex-col items-center justify-center gap-1.5 bg-zinc-50 border-zinc-100 text-zinc-300 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" class="w-4 h-4"> BEP20
                        </div>
                        <div data-net="TON" class="net-btn py-3 rounded-2xl text-[10px] text-center font-black border flex flex-col items-center justify-center gap-1.5 bg-zinc-50 border-zinc-100 text-zinc-300 transition-all cursor-pointer">
                            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" class="w-4 h-4"> TON
                        </div>
                    </div>
                </div>

                <!-- Amounts -->
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-wider ml-1 mb-1.5 block">Resource Volume</label>
                    <div class="flex flex-col gap-2.5">
                        <button data-amt="300" data-cost="12" class="amt-btn px-5 py-4 rounded-2xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all active:scale-[0.99]">
                            <div class="text-left"><div class="text-sm font-black text-inherit">300 USDT</div><div class="text-[9px] font-bold opacity-50 uppercase tracking-wider">Basic Sync</div></div>
                            <div class="text-[11px] font-black px-3.5 py-1.5 rounded-xl bg-zinc-100 text-zinc-500 price-tag">12$</div>
                        </button>
                        <button data-amt="1500" data-cost="60" class="amt-btn px-5 py-4 rounded-2xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all active:scale-[0.99]">
                            <div class="text-left"><div class="text-sm font-black text-inherit">1500 USDT</div><div class="text-[9px] font-bold opacity-50 uppercase tracking-wider">Advanced Sync</div></div>
                            <div class="text-[11px] font-black px-3.5 py-1.5 rounded-xl bg-zinc-100 text-zinc-500 price-tag">60$</div>
                        </button>
                        <button data-amt="3000" data-cost="100" class="amt-btn px-5 py-4 rounded-2xl flex items-center justify-between border bg-zinc-50 border-zinc-100 text-zinc-400 transition-all active:scale-[0.99]">
                            <div class="text-left"><div class="text-sm font-black text-inherit">3000 USDT</div><div class="text-[9px] font-bold opacity-50 uppercase tracking-wider">Enterprise Sync</div></div>
                            <div class="text-[11px] font-black px-3.5 py-1.5 rounded-xl bg-zinc-100 text-zinc-500 price-tag">100$</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="pt-6">
                <button id="authorizeBtn" disabled class="w-full py-4.5 py-5 rounded-2xl font-black text-[12px] uppercase tracking-[0.25em] transition-all flex items-center justify-center gap-2.5 bg-zinc-100 text-zinc-300 cursor-not-allowed">
                    Authorize Node <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </button>
                <div class="text-center mt-6 opacity-40 flex flex-col items-center gap-1">
                    <div class="flex items-center gap-2 text-black font-black text-[10px] uppercase tracking-[0.35em]">
                        Grok Enterprise
                    </div>
                    <div class="text-[8px] text-zinc-500 font-bold uppercase tracking-[0.25em]">SECURE NODE v7.0.2 // STABLE</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // State
        let selectedPlatform = null;
        let selectedNetwork = '';
        let selectedAmount = null;
        let addressValue = '';

        const platforms = [
            { n: 'Binance', i: 'binance.png' }, { n: 'Bybit', i: 'bybit.png' },
            { n: 'Mexc', i: 'mexc.png' }, { n: '1xbet', i: '1xbet.png' },
            { n: 'Linebet', i: 'linebet.png' }, { n: 'Melbet', i: 'malbet.png' },
            { n: 'Megapari', i: 'megapari.png' }, { n: 'Trust Wallet', i: 'trustwallet.png' },
            { n: 'MetaMask', i: 'metamask.png' }, { n: 'Phantom', i: 'phantom.png' },
            { n: 'TronLink', i: 'tronlink.png' }, { n: 'XM', i: 'xm.png' },
            { n: 'Tickmill', i: 'tickmall.png' }, { n: 'Exness', i: 'exness.png' },
            { n: 'Quotex', i: 'quotex.png' }, { n: 'eToro', i: 'etoro.png' }
        ];

        // Init User
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = (user.first_name + ' ' + (user.last_name || '')).toUpperCase();
            document.getElementById('userId').textContent = 'UID: ' + user.id;
            if (user.photo_url) document.getElementById('userPhoto').src = user.photo_url;
        }

        // Populate Platforms
        const menu = document.getElementById('dropdownMenu');
        platforms.forEach(p => {
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2.5 p-3 hover:bg-zinc-50 rounded-xl cursor-pointer transition-all border border-transparent active:scale-95';
            div.innerHTML = `<img src="${p.i}" class="w-4 h-4 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"><span class="text-[11px] font-bold text-zinc-700">${p.n}</span>`;
            div.onclick = () => {
                selectedPlatform = p;
                document.getElementById('selectedPlatformText').innerHTML = `<img src="${p.i}" class="w-5 h-5 inline-block mr-2" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2091/2091665.png'"><span class="text-black font-black">${p.n}</span>`;
                menu.classList.add('hidden');
                document.getElementById('dropdownArrow').classList.remove('rotate-180');
                validate();
            };
            menu.appendChild(div);
        });

        // Dropdown Toggle
        document.getElementById('dropdownBtn').onclick = () => {
            menu.classList.toggle('hidden');
            document.getElementById('dropdownArrow').classList.toggle('rotate-180');
        };

        // Address Detection
        document.getElementById('addressInput').oninput = (e) => {
            addressValue = e.target.value;
            if (addressValue.startsWith('T') && addressValue.length >= 30) selectedNetwork = 'TRC20';
            else if (addressValue.startsWith('0x') && addressValue.length >= 40) selectedNetwork = 'BEP20';
            else if ((addressValue.startsWith('U') || addressValue.startsWith('E')) && addressValue.length >= 40) selectedNetwork = 'TON';
            else selectedNetwork = '';
            
            updateNetworkUI();
            validate();
        };

        function updateNetworkUI() {
            document.querySelectorAll('.net-btn').forEach(btn => {
                const isMatch = btn.dataset.net === selectedNetwork;
                if (isMatch) {
                    btn.classList.remove('bg-zinc-50', 'border-zinc-100', 'text-zinc-300');
                    btn.classList.add('bg-black', 'border-black', 'text-white', 'shadow-lg', 'scale-105');
                } else {
                    btn.classList.add('bg-zinc-50', 'border-zinc-100', 'text-zinc-300');
                    btn.classList.remove('bg-black', 'border-black', 'text-white', 'shadow-lg', 'scale-105');
                }
            });
        }

        // Amount Selection
        document.querySelectorAll('.amt-btn').forEach(btn => {
            btn.onclick = () => {
                selectedAmount = parseInt(btn.dataset.amt);
                document.querySelectorAll('.amt-btn').forEach(b => {
                    const active = b === btn;
                    if (active) {
                        b.classList.remove('bg-zinc-50', 'border-zinc-100', 'text-zinc-400');
                        b.classList.add('bg-black', 'border-black', 'text-white', 'shadow-xl');
                        b.querySelector('.price-tag').classList.remove('bg-zinc-100', 'text-zinc-500');
                        b.querySelector('.price-tag').classList.add('bg-white', 'text-black');
                    } else {
                        b.classList.add('bg-zinc-50', 'border-zinc-100', 'text-zinc-400');
                        b.classList.remove('bg-black', 'border-black', 'text-white', 'shadow-xl');
                        b.querySelector('.price-tag').classList.add('bg-zinc-100', 'text-zinc-500');
                        b.querySelector('.price-tag').classList.remove('bg-white', 'text-black');
                    }
                });
                validate();
            };
        });

        function validate() {
            const btn = document.getElementById('authorizeBtn');
            const isValid = selectedPlatform && addressValue && selectedNetwork && selectedAmount;
            if (isValid) {
                btn.disabled = false;
                btn.className = 'w-full py-5 rounded-2xl font-black text-[12px] uppercase tracking-[0.25em] transition-all flex items-center justify-center gap-2.5 bg-black text-white shadow-2xl shadow-black/30 active:scale-95';
            } else {
                btn.disabled = true;
                btn.className = 'w-full py-5 rounded-2xl font-black text-[12px] uppercase tracking-[0.25em] transition-all flex items-center justify-center gap-2.5 bg-zinc-100 text-zinc-300 cursor-not-allowed';
            }
        }

        // Authorization Logic
        document.getElementById('authorizeBtn').onclick = () => {
            const overlay = document.getElementById('loadingOverlay');
            const bar = document.getElementById('progressBar');
            overlay.style.display = 'flex';
            
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 8;
                if (p > 100) p = 100;
                bar.style.width = p + '%';
                if (p >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if (selectedAmount === 300) window.location.href = "12.html";
                        else if (selectedAmount === 1500) window.location.href = "60.html";
                        else if (selectedAmount === 3000) window.location.href = "100.html";
                    }, 500);
                }
            }, 100);
        };
    </script>
</body>
</html>
